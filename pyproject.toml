[project]
name = "tripwire"
version = "0.0.1"
description = "A personal AI assistant with information-flow control against prompt injection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.25.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tripwire = "tripwire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/tripwire", "backend/agent", "backend/skills", "backend/api"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend", "evals"]
addopts = "-m 'not live'"
markers = ["live: calls real Token Factory models (needs NEBIUS_API_KEY); run with -m live"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120
src = ["backend", "backend/tests"]

[tool.ruff.lint.isort]
known-first-party = ["tripwire", "agent", "skills", "api", "fakes"]
