[project]
name = "tripwire"
version = "0.0.1"
description = "A personal AI assistant with information-flow control against prompt injection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "openai>=3.25.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend", "evals"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
